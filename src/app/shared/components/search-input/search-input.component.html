<form class="search-input" role="search" aria-label="Termékkereső">
  <label class="u-visually-hidden" for="site-search">
    Keresés a termékek között
  </label>

  <input
    id="site-search"
    class="search-input__field"
    type="search"
    placeholder="Keresés terméknév alapján"
    aria-label="Keresés terméknév alapján"
  />

  <button
    class="search-input__button"
    type="submit"
    aria-label="Keresés indítása">
    Keresés
  </button>
</form>

<header class="site-header">
  <div class="u-container site-header__content">
    <!-- MOBILE -->
    <div class="site-header__mobile">
      <a class="site-header__logo" routerLink="/" (click)="closeMenu()">Nailshop</a>

      <div class="site-header__mobile-actions">
        <a
          class="site-header__mobile-action"
          routerLink="/shop"
          aria-label="Keresés és termékek megnyitása"
          (click)="closeMenu()">
          Keresés
        </a>

        <a
          class="site-header__mobile-action"
          routerLink="/cart"
          routerLinkActive="is-active"
          aria-label="Kosár megnyitása"
          (click)="closeMenu()">
          Kosár
        </a>

        <button
          type="button"
          class="site-header__mobile-action"
          aria-label="Menü megnyitása"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()">
          Menü
        </button>
      </div>
    </div>

    <!-- DESKTOP -->
    <div class="site-header__desktop">
      <a class="site-header__logo" routerLink="/">Nailshop</a>

      <div class="site-header__search">
        <app-search-input></app-search-input>
      </div>

      <nav class="site-header__nav" aria-label="Fő navigáció">
        <a
          routerLink="/shop"
          [queryParams]="{ category: 'ujdonsagok' }"
          routerLinkActive="is-active">
          Újdonságok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'alapanyagok' }"
          routerLinkActive="is-active">
          Alapanyagok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'lakkok' }"
          routerLinkActive="is-active">
          Lakkok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'diszitok' }"
          routerLinkActive="is-active">
          Díszítők
        </a>
      </nav>

      <a
        class="site-header__cart-button"
        routerLink="/cart"
        routerLinkActive="is-active"
        aria-label="Kosár megnyitása">
        Kosár
      </a>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <div
    *ngIf="isMenuOpen"
    class="mobile-menu"
    id="mobile-menu">
    <div class="mobile-menu__overlay" (click)="closeMenu()"></div>

    <div class="mobile-menu__panel">
      <button
        class="mobile-menu__close"
        type="button"
        aria-label="Menü bezárása"
        (click)="closeMenu()">
        ✕
      </button>

      <nav class="mobile-menu__nav" aria-label="Mobil navigáció">
        <a
          routerLink="/shop"
          [queryParams]="{ category: 'ujdonsagok' }"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          Újdonságok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'alapanyagok' }"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          Alapanyagok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'lakkok' }"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          Lakkok
        </a>

        <a
          routerLink="/shop"
          [queryParams]="{ category: 'diszitok' }"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          Díszítők
        </a>

        <a
          routerLink="/cart"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          Kosár
        </a>
      </nav>

      <div class="mobile-menu__auth">
        <a routerLink="/user/login" (click)="closeMenu()">
          Bejelentkezés
        </a>

        <a routerLink="/user/register" (click)="closeMenu()">
          Regisztráció
        </a>
      </div>
    </div>
  </div>
</header>

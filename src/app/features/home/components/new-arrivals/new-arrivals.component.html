<section class="new-arrivals u-section on-sale" aria-labelledby="new-arrivals-title">
  <div class="u-container">
    <div class="new-arrivals__header">
      <h2 id="new-arrivals-title">Akciós termékek</h2>

      <a routerLink="/shop" [queryParams]="{ sort: 'popular' }">
        Összes megtekintése
      </a>
    </div>

    @if (loading()) {
      <app-loading-spinner></app-loading-spinner>
    } @else if (error()) {
      <div role="alert">{{ error() }}</div>
    } @else {
      <div class="new-arrivals__grid">
        @for (product of products(); track product.id) {
          <app-product-card
            [productId]="product.id"
            [name]="product.name"
            [price]="product.price"
            [oldPrice]="product.oldPrice || null"
            [imageAlt]="product.name">
          </app-product-card>
        }
      </div>
    }
  </div>
</section>

<section class="new-arrivals u-section" aria-labelledby="new-arrivals-title">
  <div class="u-container">
    <div class="new-arrivals__header">
      <h2 id="new-arrivals-title">Újdonságok</h2>

      <a routerLink="/shop" [queryParams]="{ category: 'ujdonsagok' }">
        Összes megtekintése
      </a>
    </div>

    <div class="new-arrivals__grid">
      <app-product-card
        productId="1"
        name="Builder Gel Pink"
        [price]="3990"
        imageAlt="Builder Gel Pink"
      ></app-product-card>

      <app-product-card
        productId="2"
        name="Glossy Top Coat"
        [price]="2490"
        [oldPrice]="2990"
        imageAlt="Glossy Top Coat"
      ></app-product-card>

      <app-product-card
        productId="3"
        name="Silver Nail Stickers"
        [price]="1990"
        imageAlt="Silver Nail Stickers"
      ></app-product-card>

      <app-product-card
        productId="4"
        name="Cuticle Oil"
        [price]="2190"
        imageAlt="Cuticle Oil"
      ></app-product-card>
    </div>
  </div>
</section>

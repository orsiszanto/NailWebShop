<section class="newsletter u-section" aria-labelledby="newsletter-title">
  <div class="u-container newsletter__content">

    <div class="newsletter__text">
      <h2 id="newsletter-title">Ne maradj le az újdonságokról!</h2>
      <p>Iratkozz fel hírlevelünkre, és értesülj elsőként az akciókról és új termékekről.</p>
    </div>

    <form class="newsletter__form" aria-label="Hírlevél feliratkozás">

      <label for="email" class="u-visually-hidden">
        Email cím
      </label>

      <input
        id="email"
        type="email"
        placeholder="Email címed"
        required
      />

      <button type="submit">
        Feliratkozás
      </button>

    </form>

  </div>
</section>

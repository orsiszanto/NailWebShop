<div class="product-search">
  <label class="u-visually-hidden" for="product-search-input">
    Keresés termékek között
  </label>

  <input
    id="product-search-input"
    class="product-search__input"
    type="search"
    placeholder="Keresés terméknév alapján"
    aria-label="Keresés terméknév alapján"
  />

  <button
    class="product-search__button"
    type="button"
    aria-label="Keresés indítása">
    Keresés
  </button>
</div>

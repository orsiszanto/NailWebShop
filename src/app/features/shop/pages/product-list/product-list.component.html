<section class="shop-page">
  <div class="u-container">
    <header class="shop-page__header">
      <h1>Termékek</h1>
      <p>Találd meg a számodra tökéletes alapanyagokat és kiegészítőket.</p>
    </header>

    <div class="shop-page__search">
      <app-product-search (search)="onSearch($event)"></app-product-search>
    </div>

    <app-product-filter
      [initialFilters]="currentFilters"
      (filterChange)="onFilterChange($event)"
      (resetFilters)="onResetFilters()">
    </app-product-filter>

    <section class="shop-page__results" aria-labelledby="shop-results-title">
      <h2 id="shop-results-title" class="u-visually-hidden">Terméklista</h2>

      @if (isLoading) {
        <app-loading-spinner></app-loading-spinner>
      } @else if (!hasResults) {
        <app-empty-state
          title="Nincs találat"
          description="A keresésnek vagy a beállított szűrőknek megfelelően nem találtunk terméket."
          actionLabel="Szűrők törlése"
          actionLink="/shop">
        </app-empty-state>
      } @else {
        <div class="shop-page__grid">
          @for (product of filteredProducts; track product.id) {
            <app-product-card
              [productId]="product.id"
              [name]="product.name"
              [price]="product.price"
              [oldPrice]="product.oldPrice"
              [imageAlt]="product.imageAlt">
            </app-product-card>
          }
        </div>
      }
    </section>
  </div>
</section>
